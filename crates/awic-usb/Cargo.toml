[package]
name = "awic-usb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "USB topology, hub port power and hot-plug detection (SPEC §4)."

[dependencies]
awic-core.workspace = true
# nusb's `tokio` feature is set at the workspace level (see root Cargo.toml):
# without it nusb panics at runtime on the first real control transfer.
nusb = { workspace = true }
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
libc.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
