<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AWIC: a scope screen with an analog trace above a logic lane. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#14263f"/>
      <stop offset="1" stop-color="#0a1220"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bezel)" stroke="#46546c" stroke-width="1.5"/>
  <rect x="6" y="6" width="52" height="52" rx="9" fill="url(#screen)"/>
  <g stroke="#6ea8fe" stroke-opacity="0.16" stroke-width="1">
    <path d="M19 7v50M32 7v50M45 7v50M7 19.5h50M7 32h50M7 44.5h50"/>
  </g>
  <path filter="url(#glow)" fill="none" stroke="#6ea8fe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        d="M10 26C14 26 15 13 20.5 13S27 39 32 39 38.5 13 43.5 13 50 26 54 26"/>
  <path filter="url(#glow)" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        d="M10 52h6v-7h9v7h6v-7h4v7h10v-7h9"/>
</svg>
